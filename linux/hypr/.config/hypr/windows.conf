# Personal window rules (override/extend Omarchy defaults)
# Hyprland 0.53+ syntax: https://wiki.hypr.land/Configuring/Basics/Window-Rules/

# --- Unity Editor (XWayland) ----------------------------------------------
# Unity uses class "Unity" for EVERYTHING: the main editor, modal dialogs, and
# transient popups (context menus, tooltips, the domain-reload progress bar).
# We tell them apart by title:
#   - main editor : tiled, long descriptive title  -> left alone
#   - named dialog: floating, title != "Unity"     -> center (instead of 0,0)
#   - generic popup / reload progress bar: floating, bare title "Unity"

# Named dialogs spawn at the top-left corner (0,0). Center them on screen.
windowrule = center 1, match:class ^Unity$, match:float 1, match:title negative:^Unity$

# Generic popups (context menus, popovers) and the domain-reload progress bar
# all share the bare title "Unity". Don't let them steal focus: this stops the
# reload progress bar from hijacking focus on every domain reload, while context
# menus still work fine since they're driven from the already-focused editor.
windowrule = no_focus on, match:class ^Unity$, match:float 1, match:title ^Unity$
