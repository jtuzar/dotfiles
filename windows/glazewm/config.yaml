general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  hide_method: 'cloak'
  show_all_in_taskbar: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'

gaps:
  scale_with_dpi: true
  inner_gap: '2px'
  outer_gap:
    top: '40px'
    right: '2px'
    bottom: '2px'
    left: '2px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#8dbcff'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'small_rounded'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: true
      color: '#333333'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'small_rounded'
    transparency:
      enabled: false
      opacity: '0%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'lwin+control+alt+r']

keybindings:
  # Hypr key: Ctrl+Alt+Win.
  - commands: ['focus --direction left']
    bindings: ['lwin+control+alt+h', 'lwin+control+alt+left']
  - commands: ['focus --direction right']
    bindings: ['lwin+control+alt+l', 'lwin+control+alt+right']
  - commands: ['focus --direction up']
    bindings: ['lwin+control+alt+k', 'lwin+control+alt+up']
  - commands: ['focus --direction down']
    bindings: ['lwin+control+alt+j', 'lwin+control+alt+down']

  - commands: ['move --direction left']
    bindings: ['lwin+control+alt+shift+h', 'lwin+control+alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['lwin+control+alt+shift+l', 'lwin+control+alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['lwin+control+alt+shift+k', 'lwin+control+alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['lwin+control+alt+shift+j', 'lwin+control+alt+shift+down']

  - commands: ['focus --workspace 1']
    bindings: ['lwin+control+alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['lwin+control+alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['lwin+control+alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['lwin+control+alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['lwin+control+alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['lwin+control+alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['lwin+control+alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['lwin+control+alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['lwin+control+alt+9']

  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['lwin+control+alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['lwin+control+alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['lwin+control+alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['lwin+control+alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['lwin+control+alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['lwin+control+alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['lwin+control+alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['lwin+control+alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['lwin+control+alt+shift+9']

  - commands: ['focus --next-active-workspace']
    bindings: ['lwin+control+alt+page_down']
  - commands: ['focus --prev-active-workspace']
    bindings: ['lwin+control+alt+page_up']
  - commands: ['focus --recent-workspace']
    bindings: ['lwin+control+alt+tab']

  - commands: ['move-workspace --direction left']
    bindings: ['lwin+control+alt+shift+page_up']
  - commands: ['move-workspace --direction right']
    bindings: ['lwin+control+alt+shift+page_down']

  - commands: ['toggle-floating --centered']
    bindings: ['lwin+control+alt+v']
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+control+alt+f']
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+control+alt+shift+space']
  - commands: ['wm-cycle-focus']
    bindings: ['lwin+control+alt+oem_semicolon']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['lwin+control+alt+r']
  - commands: ['toggle-minimized']
    bindings: ['lwin+control+alt+m']
  - commands: ['close']
    bindings: ['lwin+control+alt+w']

  - commands: ['wm-reload-config']
    bindings: ['lwin+control+alt+shift+r']
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+control+alt+shift+p']
  - commands: ['wm-redraw']
    bindings: ['lwin+control+alt+shift+w']
  - commands: ['wm-exit']
    bindings: ['lwin+control+alt+shift+escape']
